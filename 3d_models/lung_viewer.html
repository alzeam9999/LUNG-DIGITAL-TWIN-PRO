<!DOCTYPE html>
<html lang="ar">
<head>
    <meta charset="UTF-8">
    <style>
        body { margin: 0; overflow: hidden; background-color: #111418; }
        #info {
            position: absolute;
            bottom: 10px;
            left: 10px;
            color: #aaa;
            font-family: Arial, Helvetica, sans-serif;
            font-size: 12px;
        }
    </style>
    <title>3D Lung Model</title>
    <!-- تحميل Three.js بالطريقة التقليدية -->
    <script type="text/javascript" src="https://unpkg.com/three@0.128.0/build/three.js"></script>
    <script type="text/javascript" src="https://unpkg.com/three@0.128.0/examples/js/controls/OrbitControls.js"></script>
    <script type="text/javascript" src="https://unpkg.com/three@0.128.0/examples/js/loaders/GLTFLoader.js"></script>
</head>
<body>
    <script type="text/javascript">
        // إعداد المشهد
        const scene = new THREE.Scene();
        scene.background = new THREE.Color(0x111418);

        const camera = new THREE.PerspectiveCamera(45, window.innerWidth / window.innerHeight, 0.1, 1000);
        camera.position.set(0, 2, 1);

        const renderer = new THREE.WebGLRenderer({ antialias: true });
        renderer.setSize(window.innerWidth, window.innerHeight);
        renderer.setPixelRatio(window.devicePixelRatio);
        document.body.appendChild(renderer.domElement);

        // إضاءة محيطة
        const ambientLight = new THREE.AmbientLight(0x404060);
        scene.add(ambientLight);

        // إضاءة اتجاهية رئيسية
        const dirLight = new THREE.DirectionalLight(0xffffff, 1);
        dirLight.position.set(1, 2, 1);
        scene.add(dirLight);

        // إضاءة خلفية
        const backLight = new THREE.DirectionalLight(0x446688, 0.5);
        backLight.position.set(-1, -1, -1);
        scene.add(backLight);

        // إضاءة إضافية من الأسفل
        const fillLight = new THREE.DirectionalLight(0x88aaff, 0.5);
        fillLight.position.set(0, -1, 1);
        scene.add(fillLight);

        // تحكمات
        const controls = new THREE.OrbitControls(camera, renderer.domElement);
        controls.enableDamping = true;
        controls.dampingFactor = 0.05;
        controls.autoRotate = false;
        controls.enableZoom = true;
        controls.target.set(0, 0, 0);

        // تحميل النموذج GLB
        const loader = new THREE.GLTFLoader();
        loader.load(
            'lung_model.glb',
            function (gltf) {
                const model = gltf.scene;
                // قد تحتاج إلى ضبط المقياس حسب حجم النموذج
                // model.scale.set(0.1, 0.1, 0.1);
                scene.add(model);
                console.log('✅ نموذج الرئة تم تحميله بنجاح');
            },
            function (xhr) {
                console.log((xhr.loaded / xhr.total * 100) + '% loaded');
            },
            function (error) {
                console.error('❌ خطأ في تحميل النموذج:', error);
            }
        );

        // حلقة التحديث
        function animate() {
            requestAnimationFrame(animate);
            controls.update();
            renderer.render(scene, camera);
        }
        animate();

        // معالجة تغيير حجم النافذة
        window.addEventListener('resize', function() {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        });
    </script>
    <div id="info">🫁 استخدم الفأرة لتحريك النموذج</div>
</body>
</html>
